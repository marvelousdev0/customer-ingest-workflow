apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-ingest-workflow
  labels:
    app: customer-ingest-workflow
spec:
  # 2 pods share a consumer group across 4 Kafka partitions (concurrency=2 per pod).
  replicas: 2
  selector:
    matchLabels:
      app: customer-ingest-workflow
  template:
    metadata:
      labels:
        app: customer-ingest-workflow
    spec:
      containers:
        - name: customer-ingest-workflow
          image: ${IMAGE:customer-ingest-workflow:local}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: VIRTUAL_THREADS_ENABLED
              value: "true"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: ${KAFKA_BOOTSTRAP_SERVERS}
            - name: KAFKA_SECURITY_PROTOCOL
              value: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
            - name: KAFKA_SASL_MECHANISM
              value: ${KAFKA_SASL_MECHANISM}
            - name: KAFKA_SASL_JAAS_CONFIG
              value: ${KAFKA_SASL_JAAS_CONFIG}
            - name: KAFKA_CONSUMER_GROUP
              value: ${KAFKA_CONSUMER_GROUP:customer-ingest-workflow}
            - name: KAFKA_INBOUND_TOPIC
              value: ${KAFKA_INBOUND_TOPIC:customer.ingest.in}
            - name: KAFKA_OUTBOUND_TOPIC
              value: ${KAFKA_OUTBOUND_TOPIC:customer.ingest.out}
            - name: KAFKA_LISTENER_CONCURRENCY
              value: "2"
            - name: KAFKA_MAX_POLL_RECORDS
              value: "25"
            - name: SCHEMA_REGISTRY_URL
              value: ${SCHEMA_REGISTRY_URL}
            - name: SCHEMA_REGISTRY_AUTH_SOURCE
              value: ${SCHEMA_REGISTRY_AUTH_SOURCE}
            - name: SCHEMA_REGISTRY_USER_INFO
              value: ${SCHEMA_REGISTRY_USER_INFO}
            - name: MONGODB_URI
              value: ${MONGODB_URI}
            - name: REDIS_HOST
              value: ${REDIS_HOST}
            - name: REDIS_PORT
              value: ${REDIS_PORT:6379}
            - name: REDIS_PASSWORD
              value: ${REDIS_PASSWORD}
            - name: REDIS_LOCK_TTL
              value: ${REDIS_LOCK_TTL:10s}
            - name: REDIS_DEDUP_TTL
              value: ${REDIS_DEDUP_TTL:7d}
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
