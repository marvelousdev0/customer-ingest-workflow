apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-ingest-workflow
  labels:
    app: customer-ingest-workflow
spec:
  # 2 pods share a consumer group across 4 Kafka partitions (concurrency=2 per pod).
  replicas: 2
  selector:
    matchLabels:
      app: customer-ingest-workflow
  template:
    metadata:
      labels:
        app: customer-ingest-workflow
    spec:
      automountServiceAccountToken: false
      containers:
        - name: customer-ingest-workflow
          image: ${IMAGE:customer-ingest-workflow:local}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: VIRTUAL_THREADS_ENABLED
              value: "true"
            # HashiCorp Vault — connection placeholders only.
            # Kafka / Mongo / Redis / Schema Registry credentials are read from Vault KV.
            - name: VAULT_ENABLED
              value: "true"
            - name: VAULT_URI
              value: ${VAULT_URI:http://vault.vault.svc:8200}
            - name: VAULT_AUTHENTICATION
              value: ${VAULT_AUTHENTICATION:TOKEN}
            - name: VAULT_TOKEN
              value: ${VAULT_TOKEN:00000000-0000-0000-0000-000000000000}
            - name: VAULT_CONFIG_IMPORT
              value: ${VAULT_CONFIG_IMPORT:vault://}
            - name: VAULT_FAIL_FAST
              value: ${VAULT_FAIL_FAST:true}
            - name: VAULT_KV_BACKEND
              value: ${VAULT_KV_BACKEND:secret}
            - name: VAULT_KV_DEFAULT_CONTEXT
              value: ${VAULT_KV_DEFAULT_CONTEXT:customer-ingest-workflow}
            # LaunchDarkly — SDK key is expected from Vault (app.launchdarkly.sdk-key).
            # These are connection/behavior placeholders only.
            - name: LAUNCHDARKLY_ENABLED
              value: ${LAUNCHDARKLY_ENABLED:true}
            - name: LAUNCHDARKLY_OFFLINE
              value: ${LAUNCHDARKLY_OFFLINE:false}
            - name: LAUNCHDARKLY_START_WAIT
              value: ${LAUNCHDARKLY_START_WAIT:5s}
            # Non-secret tuning (not stored in Vault).
            - name: KAFKA_CONSUMER_GROUP
              value: ${KAFKA_CONSUMER_GROUP:customer-ingest-workflow}
            - name: KAFKA_LISTENER_CONCURRENCY
              value: "2"
            - name: KAFKA_MAX_POLL_RECORDS
              value: "25"
            - name: REDIS_LOCK_TTL
              value: ${REDIS_LOCK_TTL:10s}
            - name: REDIS_DEDUP_TTL
              value: ${REDIS_DEDUP_TTL:7d}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 512Mi
